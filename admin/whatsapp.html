<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WhatsApp · MyM Soluciones</title>
<link rel="icon" href="../img/favicon.png" type="image/png">
<!-- EL PANEL DEL WHATSAPP DE MyM SOLUCIONES (30/10/2026): las charlas del 11 3366-2080, que atiende
     el robot de ventas en el server de MyM (ventas-sol.js de AppMyM). Se leen y se contestan con la
     clave VENTAS_SOL_PANEL_CLAVE (una variable del servicio de MyM). La clave queda sólo en esta
     pestaña (sessionStorage).
     31/10/2026 (Budy: "lo más funcional posible"): resumen y embudo arriba, filtros, ficha editable
     con etapa y notas, atender/devolver, resolver, respuestas rápidas que vienen del server (los
     textos y precios no se escriben acá), refresco cada 20 s sólo con la pestaña visible y aviso
     del navegador cuando entra un mensaje o una derivación. -->
<style>
  :root { --canvas:#0b0b0b; --s1:#141414; --s2:#1c1c1c; --line:#2a2a2a; --line-2:#3a3a3a; --ink:#f4f4f2; --ink-3:#a3a39c; --accent:#c9a227; --accent-2:#e6c766; --ok:#3ccf7a; --err:#ff7b6b; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 14px 16px; }
  /* Todo entra en el alto de la pantalla: sólo scrollean adentro la lista, los mensajes y la ficha, sin barra visible. */
  #panel:not([hidden]) { height: calc(100dvh - 28px); display: flex; flex-direction: column; }
  .scroll { overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  header h1 span { color: var(--accent); }
  a { color: var(--accent); }
  input, textarea, button, select { font: inherit; }
  input, textarea, select { background: var(--canvas); border: 1px solid var(--line-2); color: var(--ink); border-radius: 10px; padding: 9px 11px; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  label { font-size: 12px; color: var(--ink-3); display: grid; gap: 3px; }
  .btn { background: var(--accent); color: #140f00; border: 0; border-radius: 999px; padding: 8px 15px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--accent-2); }
  .btn.gris { background: var(--s2); color: var(--ink); border: 1px solid var(--line-2); }
  .btn.gris:hover { border-color: var(--accent); }
  .btn.chico { padding: 5px 11px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .entrar { max-width: 360px; margin: 12vh auto; display: grid; gap: 12px; background: var(--s1); border: 1px solid var(--line); border-radius: 16px; padding: 26px; }
  .entrar h1 { font-size: 19px; margin: 0; } .entrar h1 span { color: var(--accent); }
  .aviso, #wamsg { color: var(--ink-3); font-size: 14px; margin: 0; }
  #wamsg:empty { display: none; } #wamsg { margin-bottom: 10px; }
  .err { color: var(--err); }

  /* Resumen */
  .tarjetas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
  .tarj { background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; text-align: left; color: var(--ink); }
  .tarj b { display: block; font-size: 24px; line-height: 1.2; }
  .tarj small { color: var(--ink-3); font-size: 12px; }
  .tarj.alerta { border-color: var(--accent); background: linear-gradient(180deg, #2a2208, var(--s1)); }
  .tarj.alerta b { color: var(--accent-2); }
  .embudo { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .embudo button { flex: 1 1 110px; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); padding: 7px 10px; cursor: pointer; text-align: left; font-size: 13px; }
  .embudo button b { float: right; color: var(--accent); }
  .embudo button.on, .filtros button.on { border-color: var(--accent); background: #241e0a; }
  @media (max-width: 640px) { .tarjetas { grid-template-columns: repeat(2, 1fr); } }

  /* Grilla */
  .grilla { flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr) 290px; gap: 12px; }
  .grilla > * { min-height: 0; min-width: 0; }
  #lado { display: flex; flex-direction: column; }
  @media (max-width: 1100px) { .grilla { grid-template-columns: 300px minmax(0, 1fr); } .grilla:not(.ver-ficha) #ficha, .grilla.ver-ficha #chat { display: none; } .solo-med { display: inline-block !important; } }
  @media (max-width: 760px) {
    .grilla { grid-template-columns: minmax(0, 1fr); }
    .tarjetas, .embudo { display: none; }
    .grilla.abierta #lado { display: none; }
    .grilla:not(.abierta) #chat, .grilla:not(.abierta) #ficha { display: none; }
    .solo-cel { display: inline-block !important; }
  }
  .solo-cel, .solo-med { display: none !important; }
  .filtros { display: flex; gap: 5px; flex-wrap: wrap; margin: 8px 0; }
  .filtros button { background: var(--s1); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  #walista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
  #walista li { min-width: 0; overflow: hidden; flex-shrink: 0; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; }
  #walista li:hover { border-color: var(--line-2); }
  #walista li.on { border-color: var(--accent); }
  #walista li.resuelta { opacity: .6; }
  .fila { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .fila b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #walista small { color: var(--ink-3); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; border-radius: 999px; padding: 1px 8px; background: var(--s2); color: var(--ink-3); border: 1px solid var(--line); }
  .chip.oro { background: var(--accent); color: #140f00; border-color: var(--accent); font-weight: 600; }
  .chip.der { background: #2e250a; color: var(--accent-2); border-color: #5a4710; }
  .chip.rojo { background: #3a1410; color: var(--err); border-color: #6a2820; }
  .chip.verde { color: var(--ok); }

  #chat, #ficha { overflow-y: auto; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  #chat { display: flex; flex-direction: column; gap: 10px; }
  .cab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .cab small { color: var(--ink-3); }
  .acciones { display: flex; gap: 6px; flex-wrap: wrap; }
  .msgs { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
  .m { max-width: 82%; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; background: var(--s2); }
  .m.cliente { align-self: flex-start; }
  .m.robot, .m.humano { align-self: flex-end; background: #2a2208; }
  .m.humano { background: #12301f; }
  .m small { display: block; color: var(--ink-3); font-size: 11px; margin-top: 3px; }
  .cerrada { background: #2a1512; border: 1px solid #6a2820; color: #ffc2b8; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .rapidas { display: flex; gap: 5px; flex-wrap: wrap; }
  .rapidas button { background: var(--canvas); border: 1px dashed var(--line-2); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .rapidas button:hover { border-color: var(--accent); color: var(--accent-2); }
  .escribir { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
  .escribir textarea { min-height: 60px; resize: vertical; }
  #ficha h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); text-transform: uppercase; letter-spacing: .6px; }
  #ficha form { display: grid; gap: 9px; }
  #ficha textarea { min-height: 90px; resize: vertical; }
  .dato { font-size: 13px; color: var(--ink-3); margin: 10px 0 0; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <form class="entrar" id="entrar" hidden>
    <h1>WhatsApp · <span>MyM Soluciones</span></h1>
    <input type="password" id="clave" placeholder="Clave del panel" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
    <p class="aviso" id="entrarmsg"></p>
  </form>
  <div id="panel" hidden>
    <header>
      <h1>WhatsApp <span>· 11 3366-2080</span></h1>
      <div class="acciones">
        <button class="btn gris chico" id="avisos" type="button" hidden>Activar avisos</button>
        <button class="btn gris chico" id="warecargar" type="button">Actualizar</button>
        <a class="btn gris chico" href="./" style="text-decoration:none">Panel</a>
        <button class="btn gris chico" id="salir" type="button">Salir</button>
      </div>
    </header>
    <p id="wamsg"></p>
    <div class="tarjetas" id="tarjetas"></div>
    <div class="embudo" id="embudo"></div>
    <div class="grilla" id="grilla">
      <div id="lado">
        <input type="search" id="wabuscar" placeholder="Buscar nombre, negocio o teléfono">
        <div class="filtros" id="filtros"></div>
        <ul id="walista" class="scroll"></ul>
      </div>
      <div id="chat"><p class="aviso">Elegí una conversación.</p></div>
      <aside id="ficha" class="scroll"><p class="aviso">La ficha del contacto aparece al abrir una conversación.</p></aside>
    </div>
  </div>
</div>
<script src="../config.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const API = String((window.SITE || {}).ventasApi || 'https://mym-creditos-81440681742.southamerica-east1.run.app').replace(/\/+$/, '');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fecha = (ts) => { const d = new Date(ts); return isNaN(d) ? '' : d.toLocaleString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
  const DE = { cliente: '', robot: 'Robot', humano: 'Equipo' };
  const TITULO = document.title;
  const FILTROS = [['todas', 'Todas'], ['sin_leer', 'Sin leer'], ['esperando', 'Esperando'], ['robot', 'Robot activo'], ['mias', 'Atendidas por mí'], ['resueltas', 'Resueltas']];
  const CAMPOS = { nombre: 'Nombre', negocio: 'Negocio', rubro: 'Rubro', automatizar: 'Qué quiere automatizar', email: 'Email', ciudad: 'Ciudad' };
  // Los nombres de etapas y motivos los manda el server; éstos son sólo por si todavía no llegaron.
  let ETAPAS = { nuevo: 'Nuevo', diagnostico: 'Diagnóstico', propuesta: 'Propuesta', cliente: 'Cliente', perdido: 'Perdido' };
  // Los textos de los motivos son de la pantalla (Budy: "no se entendía qué quería decir cada uno").
  const MOTIVOS = { diagnostico: 'Quiere el diagnóstico', precio: 'Pide precio especial', contratar: 'Quiere contratar', persona: 'Pidió hablar con una persona', consulta: 'Consulta sin respuesta' };
  let campos = Object.keys(CAMPOS), respuestas = [];
  let clave = '', charlas = [], abierta = null, filtro = 'todas', etapa = '', vistos = null, nuevos = 0, fichaSucia = '';
  try { clave = sessionStorage.getItem('sol_clave') || ''; } catch (e) {}

  async function pedir(ruta, op) {
    const r = await fetch(API + ruta, { ...(op || {}), headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + clave } });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { salir('La clave no entra.'); throw new Error('clave incorrecta'); }
    if (!r.ok) { const e = new Error(j.error || 'HTTP ' + r.status); e.status = r.status; throw e; }
    return j;
  }
  const post = (ruta, cuerpo) => pedir(ruta, { method: 'POST', body: JSON.stringify(cuerpo) });
  const ruta = (t, extra) => '/api/ventas-sol/charlas/' + encodeURIComponent(t) + (extra || '');
  function msg(t) { $('#wamsg').innerHTML = t ? '<span class="err">' + esc(t) + '</span>' : ''; }
  function salir(m) { clave = ''; try { sessionStorage.removeItem('sol_clave'); } catch (e) {} $('#panel').hidden = true; $('#entrar').hidden = false; $('#entrarmsg').textContent = m || ''; }

  const nombre = (c) => (c.datos || {}).nombre || c.nombre_perfil || '+' + c.telefono;
  const esperaMin = (c) => c.espera_desde ? Math.max(0, Math.round((Date.now() - new Date(c.espera_desde)) / 60000)) : null;
  function hace(min) { return min < 60 ? min + ' min' : min < 1440 ? Math.floor(min / 60) + ' h' : Math.floor(min / 1440) + ' d'; }

  // ---------- Resumen ----------
  async function cargarResumen() {
    try {
      const j = await pedir('/api/ventas-sol/resumen');
      if (j.etapas) ETAPAS = j.etapas;
      const r = j.resumen || {};
      $('#tarjetas').innerHTML = [['hoy', r.charlas_hoy, 'Conversaciones hoy'], ['semana', r.charlas_semana, 'Esta semana'], ['nuevas', r.nuevas_semana, 'Contactos nuevos (7 días)'], ['esperando', r.esperando, 'Esperando respuesta']]
        .map(([k, n, t]) => '<button type="button" class="tarj' + (k === 'esperando' && n ? ' alerta' : '') + '" data-f="' + (k === 'esperando' ? 'esperando' : 'todas') + '"><b>' + (n || 0) + '</b><small>' + t + '</small></button>').join('');
      const pe = r.por_etapa || {};
      $('#embudo').innerHTML = Object.keys(ETAPAS).map((k) => '<button type="button" data-etapa="' + esc(k) + '" class="' + (etapa === k ? 'on' : '') + '">' + esc(ETAPAS[k]) + '<b>' + (pe[k] || 0) + '</b></button>').join('');
    } catch (e) { /* el resumen no es imprescindible: la lista sigue andando */ }
  }
  async function cargarRespuestas() {
    try {
      const j = await pedir('/api/ventas-sol/respuestas');
      respuestas = j.respuestas || [];
      if (j.etapas) ETAPAS = j.etapas;
      if (Array.isArray(j.campos_ficha) && j.campos_ficha.length) campos = j.campos_ficha;
      if (abierta) pintarChat();
    } catch (e) {}
  }

  // ---------- Lista ----------
  function pintarFiltros() {
    $('#filtros').innerHTML = FILTROS.map(([k, t]) => '<button type="button" data-filtro="' + k + '" class="' + (filtro === k ? 'on' : '') + '">' + t + '</button>').join('')
      + (etapa ? '<button type="button" data-filtro="sin-etapa" class="on">Etapa: ' + esc(ETAPAS[etapa] || etapa) + ' ✕</button>' : '');
    document.querySelectorAll('#embudo button').forEach((b) => b.classList.toggle('on', b.dataset.etapa === etapa));
  }
  function pasa(c) {
    if (etapa && (c.etapa || 'nuevo') !== etapa) return false;
    if (filtro === 'sin_leer') return c.sin_leer > 0;
    if (filtro === 'esperando') return !!c.espera_desde && !c.resuelta;
    if (filtro === 'robot') return c.robot_activo;
    if (filtro === 'mias') return !c.robot_activo;
    if (filtro === 'resueltas') return !!c.resuelta;
    return true;
  }
  function pintarCharlas() {
    pintarFiltros();
    const q = $('#wabuscar').value.trim().toLowerCase();
    const lista = charlas.filter(pasa).filter((c) => !q || [c.datos.nombre, c.datos.negocio, c.nombre_perfil, c.telefono].join(' ').toLowerCase().includes(q));
    $('#walista').innerHTML = lista.length ? lista.map((c) => {
      const min = esperaMin(c);
      return '<li data-tel="' + esc(c.telefono) + '" class="' + (abierta && abierta.telefono === c.telefono ? 'on ' : '') + (c.resuelta ? 'resuelta' : '') + '">'
        + '<div class="fila"><b>' + esc(nombre(c)) + '</b>' + (c.sin_leer ? '<span class="chip oro">' + c.sin_leer + '</span>' : '') + '</div>'
        + (c.datos.negocio ? '<small>' + esc(c.datos.negocio) + '</small>' : '')
        + '<small>' + esc((c.ultimo || {}).texto || '') + '</small>'
        + '<div class="chips"><span class="chip">' + esc(ETAPAS[c.etapa] || ETAPAS.nuevo || 'Nuevo') + '</span>'
        + (c.derivada ? '<span class="chip der">' + esc(MOTIVOS[c.derivada.motivo] || 'Derivada') + '</span>' : '')
        + (min != null && !c.resuelta ? '<span class="chip' + (min > 30 ? ' rojo' : ' der') + '">espera hace ' + hace(min) + '</span>' : '')
        + (c.robot_activo ? '' : '<span class="chip verde">Atiende el equipo</span>')
        + (c.resuelta ? '<span class="chip verde">Resuelta</span>' : '')
        + '<span class="chip">' + (c.ventana_abierta ? '24 h abierta' : '24 h cerrada') + '</span></div></li>';
    }).join('') : '<li><small>No hay conversaciones con este filtro.</small></li>';
  }

  // ---------- Charla y ficha ----------
  function pintarChat() {
    $('#grilla').classList.toggle('abierta', !!abierta);
    if (!abierta) { $('#chat').innerHTML = '<p class="aviso">Elegí una conversación.</p>'; $('#ficha').innerHTML = '<p class="aviso">La ficha del contacto aparece al abrir una conversación.</p>'; return; }
    const c = abierta, d = c.datos || {};
    const borrador = $('#texto') ? $('#texto').value : '';
    $('#chat').innerHTML = '<div class="cab"><div><button class="btn gris chico solo-cel" id="volver" type="button">←</button> <b>' + esc(nombre(c)) + '</b> <small>+' + esc(c.telefono) + '</small>'
      + (c.derivada ? '<br><small>El robot la derivó: ' + esc((MOTIVOS[c.derivada.motivo] || c.derivada.motivo).toLowerCase()) + ' · ' + fecha(c.derivada.ts) + '</small>' : '') + '</div>'
      + '<div class="acciones"><button class="btn gris chico solo-cel solo-med" id="verficha" type="button">Ficha</button>'
      + (c.robot_activo ? '<button class="btn gris chico" id="robot" type="button" title="El robot deja de contestar en esta charla">Tomar la charla</button>' : '<button class="btn gris chico" id="robot" type="button" title="El robot vuelve a contestar en esta charla">Devolver al robot</button>')
      + (c.resuelta ? '<button class="btn chico" id="resolver" type="button" title="Vuelve a Esperando">Reabrir' : '<button class="btn chico" id="resolver" type="button" title="Sale de Esperando hasta que vuelva a escribir">Ya la atendí') + '</button></div></div>'
      + '<div class="msgs scroll" id="msgs">' + (c.mensajes || []).map((m) => '<div class="m ' + esc(m.de) + '">' + esc(m.texto) + '<small>' + (DE[m.de] ? DE[m.de] + ' · ' : '') + fecha(m.ts)
      + (m.error ? ' · <span class="err">no salió: ' + esc(m.error) + '</span>' : '') + '</small></div>').join('') + '</div>'
      + (c.ultimo_error ? '<p class="aviso err">Último error de envío: ' + esc(c.ultimo_error) + '</p>' : '')
      + (c.ventana_abierta
        ? (respuestas.length ? '<div class="rapidas">' + respuestas.map((r, i) => '<button type="button" data-rapida="' + i + '" title="' + esc(r.texto) + '">' + esc(r.titulo) + '</button>').join('') + '</div>' : '')
          + '<form class="escribir" id="escribir"><textarea id="texto" placeholder="Escribile desde el 11 3366-2080…" required></textarea><button class="btn" type="submit">Enviar</button></form>'
        : '<div class="cerrada"><b>Ventana de 24 h cerrada.</b> Pasaron más de 24 horas desde su último mensaje: WhatsApp no permite escribirle hasta que el contacto vuelva a escribir.</div>');
    if (borrador && $('#texto')) $('#texto').value = borrador;
    const msgs = $('#msgs'); msgs.scrollTop = msgs.scrollHeight;

    // Con cambios sin guardar no se repinta: el refresco no pisa lo que se está escribiendo.
    if (fichaSucia === c.telefono) { $('#fichamsg').textContent = 'Cambios sin guardar.'; return; }
    fichaSucia = '';
    $('#ficha').innerHTML = '<button class="btn gris chico solo-cel solo-med" id="verchat" type="button" style="margin-bottom:10px">← Conversación</button><h2>Ficha</h2><form id="fichaform">'
      + '<label>Etapa<select name="etapa">' + Object.keys(ETAPAS).map((k) => '<option value="' + esc(k) + '"' + ((c.etapa || 'nuevo') === k ? ' selected' : '') + '>' + esc(ETAPAS[k]) + '</option>').join('') + '</select></label>'
      + campos.map((k) => '<label>' + esc(CAMPOS[k] || k) + '<input name="d_' + esc(k) + '" value="' + esc(d[k] || '') + '"></label>').join('')
      + '<label>Notas internas (el cliente no las ve)<textarea name="notas">' + esc(c.notas || '') + '</textarea></label>'
      + '<button class="btn" type="submit">Guardar</button><p class="aviso" id="fichamsg"></p></form>'
      + '<div class="dato"><span>Primer contacto: ' + (fecha(c.creado) || '—') + '</span><span>Último mensaje del cliente: ' + (fecha(c.ultimo_cliente_en) || '—') + '</span></div>';
  }

  async function cargar() {
    try {
      charlas = (await pedir('/api/ventas-sol/charlas')).charlas || [];
      msg(''); avisar(); pintarCharlas();
    } catch (e) { msg('No se pudieron leer las conversaciones: ' + e.message); }
  }
  async function abrir(t) {
    try {
      abierta = (await pedir(ruta(t))).charla;
      const c = charlas.find((x) => x.telefono === t); if (c) c.sin_leer = 0;
      if (vistos) vistos[t] = firma(abierta);
      pintarCharlas(); pintarChat();
    } catch (e) { msg('No se pudo abrir la conversación: ' + e.message); }
  }
  function refrescarCharla(c) { const i = charlas.findIndex((x) => x.telefono === c.telefono); if (i >= 0) charlas[i] = { ...charlas[i], ...c, mensajes: undefined }; abierta = { ...abierta, ...c }; pintarCharlas(); pintarChat(); }

  // ---------- Avisos: título "(3) WhatsApp…" y notificación del navegador ----------
  const firma = (c) => ((c.ultimo || {}).ts || '') + '|' + (c.derivada ? c.derivada.ts : '');
  function avisar() {
    const ahora = {};
    charlas.forEach((c) => { ahora[c.telefono] = firma(c); });
    if (vistos) {
      const cambios = charlas.filter((c) => vistos[c.telefono] !== ahora[c.telefono] && ((c.ultimo || {}).de === 'cliente' || (c.derivada && !(vistos[c.telefono] || '').endsWith('|' + c.derivada.ts))));
      if (cambios.length) {
        nuevos += cambios.length;
        if (window.Notification && Notification.permission === 'granted') {
          const c = cambios[0];
          try { new Notification(c.derivada && !(vistos[c.telefono] || '').endsWith('|' + c.derivada.ts) ? 'Derivación: ' + nombre(c) : 'Mensaje de ' + nombre(c), { body: (c.ultimo || {}).texto || '', icon: '../img/favicon.png', tag: 'wa-' + c.telefono }); } catch (e) {}
        }
      }
    }
    vistos = ahora;
    const pend = charlas.reduce((n, c) => n + (c.sin_leer || 0), 0) || nuevos;
    document.title = (pend ? '(' + pend + ') ' : '') + TITULO;
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { nuevos = 0; tick(); } });
  if (window.Notification && Notification.permission === 'default') $('#avisos').hidden = false;
  $('#avisos').addEventListener('click', () => Notification.requestPermission().then(() => { $('#avisos').hidden = Notification.permission !== 'default'; }));

  // ---------- Eventos ----------
  function entrar() { $('#entrar').hidden = true; $('#panel').hidden = false; cargarResumen(); cargarRespuestas(); cargar(); }
  $('#entrar').addEventListener('submit', (e) => { e.preventDefault(); clave = $('#clave').value; try { sessionStorage.setItem('sol_clave', clave); } catch (er) {} entrar(); });
  $('#salir').addEventListener('click', () => salir(''));
  $('#wabuscar').addEventListener('input', pintarCharlas);
  $('#warecargar').addEventListener('click', () => { cargarResumen(); cargar(); if (abierta) abrir(abierta.telefono); });
  $('#walista').addEventListener('click', (e) => { const li = e.target.closest('li[data-tel]'); if (li) { $('#grilla').classList.remove('ver-ficha'); abrir(li.dataset.tel); } });
  $('#filtros').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.filtro === 'sin-etapa') etapa = ''; else filtro = b.dataset.filtro; pintarCharlas(); });
  $('#embudo').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; etapa = etapa === b.dataset.etapa ? '' : b.dataset.etapa; pintarCharlas(); });
  $('#tarjetas').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; filtro = b.dataset.f; etapa = ''; pintarCharlas(); });

  $('#chat').addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b || !abierta) return;
    if (b.id === 'volver') { abierta = null; pintarCharlas(); pintarChat(); return; }
    if (b.id === 'verficha') { $('#grilla').classList.add('ver-ficha'); return; }
    if (b.dataset.rapida != null) {
      const t = $('#texto'), r = respuestas[+b.dataset.rapida]; if (!t || !r) return;
      const i = t.selectionStart ?? t.value.length;
      t.value = t.value.slice(0, i) + r.texto + t.value.slice(t.selectionEnd ?? i); t.focus(); return;
    }
    if (b.id !== 'robot' && b.id !== 'resolver') return;
    b.disabled = true;
    try {
      if (b.id === 'robot') { await post(ruta(abierta.telefono, '/robot'), { activo: !abierta.robot_activo }); await abrir(abierta.telefono); }
      else refrescarCharla((await post(ruta(abierta.telefono, '/resolver'), { resuelta: !abierta.resuelta })).charla);
      cargar(); cargarResumen();
    } catch (err) { b.disabled = false; msg('No se pudo cambiar: ' + err.message); }
  });
  $('#chat').addEventListener('submit', async (e) => {
    e.preventDefault();
    const texto = $('#texto').value.trim(), boton = e.target.querySelector('button');
    if (!texto || !abierta) return;
    boton.disabled = true;
    try { await post(ruta(abierta.telefono, '/responder'), { texto }); $('#texto').value = ''; await abrir(abierta.telefono); cargar(); }
    catch (err) {
      boton.disabled = false;
      if (err.status === 409) { abierta.ventana_abierta = false; pintarChat(); msg('La ventana de 24 h está cerrada: no se puede escribirle hasta que vuelva a escribir.'); }
      else msg('No se pudo mandar: ' + err.message);
    }
  });
  $('#ficha').addEventListener('input', () => { if (abierta) { fichaSucia = abierta.telefono; $('#fichamsg').textContent = 'Cambios sin guardar.'; } });
  $('#ficha').addEventListener('click', (e) => { if (e.target.id === 'verchat') $('#grilla').classList.remove('ver-ficha'); });
  $('#ficha').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!abierta) return;
    const f = e.target, d = abierta.datos || {}, datos = {}, cuerpo = {};
    campos.forEach((k) => { const v = f['d_' + k].value.trim(); if (v !== (d[k] || '')) datos[k] = v; });
    if (Object.keys(datos).length) cuerpo.datos = datos;
    if (f.etapa.value !== (abierta.etapa || 'nuevo')) cuerpo.etapa = f.etapa.value;
    if (f.notas.value.trim() !== (abierta.notas || '')) cuerpo.notas = f.notas.value.trim();
    if (!Object.keys(cuerpo).length) { fichaSucia = ''; $('#fichamsg').textContent = 'No hay cambios.'; return; }
    const b = f.querySelector('button'); b.disabled = true;
    try { const ch = (await post(ruta(abierta.telefono, '/ficha'), cuerpo)).charla; fichaSucia = ''; refrescarCharla(ch); $('#fichamsg').textContent = 'Guardado.'; if (cuerpo.etapa) cargarResumen(); }
    catch (err) { b.disabled = false; $('#fichamsg').innerHTML = '<span class="err">No se pudo guardar: ' + esc(err.message) + '</span>'; }
  });

  // Cada 20 s y sólo con la pestaña visible: cada vuelta son lecturas pagas de Firestore en MyM.
  // Mientras se escribe un mensaje no se refresca la charla; la ficha se cuida sola (fichaSucia).
  function tick() {
    if (document.hidden || $('#panel').hidden) return;
    cargar(); cargarResumen();
    const foco = document.activeElement;
    if (abierta && !(foco && foco.id === 'texto')) abrir(abierta.telefono);
  }
  setInterval(tick, 20000);
  clave ? entrar() : salir('');
})();
</script>
</body>
</html>
